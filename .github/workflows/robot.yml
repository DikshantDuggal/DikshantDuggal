name: Generate contribution robot
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SVG
        env:
          GH_USER: DikshantDuggal
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_robot.py
      - name: Push to output branch
        run: |
          cd dist
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b output
          git add robot.svg
          git commit -q -m "update robot"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
 
