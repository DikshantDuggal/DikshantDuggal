<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Quote by L. Peter Deutsch</title>
  <desc id="desc">When I was at what I would consider the peak of my abilities, I had extremely trustworthy intuition. I would do things and they would just turn out right.</desc>
  <rect width="580" height="200" rx="8" fill="#1a1b27"/>
  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-style="italic" font-size="20" fill="#38bdae">
    <text x="22" y="50"><tspan fill="#bf91f3">&#8220;</tspan>When I was at what I would consider the peak of</text>
    <text x="22" y="82">my abilities, I had extremely trustworthy</text>
    <text x="22" y="114">intuition. I would do things and they would</text>
    <text x="22" y="146">just turn out right.<tspan fill="#bf91f3">&#8221;</tspan></text>
    <text x="558" y="182" text-anchor="end" fill="#70a5fd" font-size="17">&#8212; L. Peter Deutsch</text>
  </g>
</svg>
